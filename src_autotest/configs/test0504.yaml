# ──────────────────────────────────────────────────────────────
# Usage (from DHIRL root):
#   python -m src_autotest.run src_autotest/configs/test0504.yaml
# ──────────────────────────────────────────────────────────────

# We locate the final step of regularization weight, then test num_epoch effects to locate RNN, LSTM, and Transformer models.
defaults:
  ll_filename: ll.csv
  output_dir: src_autotest/outputs
  num_repeats: 1
  num_latents: 3
  rand_seed: 42

  model_type: IntentionRNN
  hidden_dim: 128
  rnn_hidden_dim: 128
  num_layers: 1
  dropout: 0.3
  nhead: 4
  lr: 0.001

  reg_type: kl+l1
  reg_weight: 2.22
  kl_weight: 1.48

  num_epochs: 3
  loss_threshold: 0.05
  max_iterations: 180


# Each experiment only needs an id and the params that differ from defaults.
groups:
  LSTM_ablation:
    id: G02
    description: ""
    experiments:
      - id: E01
        model_type: IntentionLSTM
        rand_seed: 0
      - id: E02
        model_type: IntentionLSTM
        rand_seed: 1223
      - id: E03
        model_type: IntentionLSTM
        rand_seed: 999
  Transformer_ablation:
    id: G03
    description: ""
    experiments:
      - id: E01
        model_type: IntentionTransformer
        rand_seed: 0
        num_epochs: 8
      - id: E02
        model_type: IntentionTransformer
        rand_seed: 1223
        num_epochs: 8
      - id: E03
        model_type: IntentionTransformer
        rand_seed: 999
        num_epochs: 8