# ──────────────────────────────────────────────────────────────
# Autotest config for src_autotest/train_labyrinth_b.py
#
# Usage (from DHIRL root):
#   python -m src_autotest.run src_autotest/configs/test0315.yaml
#   python -m src_autotest.run src_autotest/configs/test0315.yaml --groups model_comparison
# ──────────────────────────────────────────────────────────────

defaults:
  ll_filename: ll.csv
  output_dir: src_autotest/outputs
  num_repeats: 1
  num_latents: 3
  rand_seed: 42

  model_type: IntentionRNN
  hidden_dim: 128
  rnn_hidden_dim: 128
  num_layers: 1
  dropout: 0.3
  nhead: 4
  lr: 0.001

  reg_type: l1
  reg_weight: 1.95

  num_epochs: 3
  loss_threshold: 0.05
  max_iterations: 180


# Each experiment only needs an id and the params that differ from defaults.
groups:

  regularization:
    id: G01
    description: "L1 vs KL and different weights"
    experiments:
      - id: E01
        reg_type: l1
        reg_weight: 2.00
      - id: E02
        reg_type: l1
        reg_weight: 2.04
      - id: E03
        reg_type: l1
        reg_weight: 2.08
      - id: E04
        reg_type: l1
        reg_weight: 2.12
      - id: E05
        reg_type: l1
        reg_weight: 2.16
      - id: E03
        reg_type: kl
        reg_weight: 1.32
      - id: E04
        reg_type: kl
        reg_weight: 1.34
      - id: E05
        reg_type: kl
        reg_weight: 1.36

  num_epochs:
    id: G02
    description: "Impact of number of training epochs"
    experiments:
      - id: E01
        model_type: IntentionRNN
        num_epochs: 1
      - id: E02
        model_type: IntentionLSTM
        num_epochs: 1
      - id: E03
        model_type: IntentionRNN
        num_epochs: 5
      - id: E04
        model_type: IntentionLSTM
        num_epochs: 5
      - id: E05
        model_type: IntentionTransformer
        num_epochs: 5
      - id: E06
        model_type: IntentionTransformer
        num_epochs: 8
      - id: E07
        model_type: IntentionTransformer
        num_epochs: 10
      - id: E08
        model_type: IntentionTransformer
        num_epochs: 12
