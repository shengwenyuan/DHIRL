# ──────────────────────────────────────────────────────────────
# Autotest config for src_autotest/train_labyrinth_b.py
#
# Usage (from DHIRL root):
#   python -m src_autotest.run src_autotest/configs/test0315.yaml
#   python -m src_autotest.run src_autotest/configs/test0315.yaml --groups model_comparison
# ──────────────────────────────────────────────────────────────

defaults:
  ll_filename: ll.csv
  output_dir: src_autotest/outputs
  num_repeats: 1
  num_latents: 3
  rand_seed: 42

  model_type: IntentionRNN
  hidden_dim: 128
  rnn_hidden_dim: 128
  num_layers: 1
  dropout: 0.3
  nhead: 4
  lr: 0.001

  reg_type: l1
  reg_weight: 2.16
  kl_weight: 0.0

  num_epochs: 3
  loss_threshold: 0.05
  max_iterations: 180


# Each experiment only needs an id and the params that differ from defaults.
groups:

  temp:
    id: G00
    description: "L1 vs KL and different weights"
    experiments:
      - id: E06
        reg_type: l1
        reg_weight: 2.08
      - id: E07
        reg_type: l1
        reg_weight: 2.12
      - id: E08
        reg_type: l1
        reg_weight: 2.16

  regularization:
    id: G01
    description: "L1 vs KL and different weights"
    experiments:
      - id: E01
        reg_type: l1
        reg_weight: 2.22
      - id: E02
        reg_type: l1
        reg_weight: 2.26
      - id: E03
        reg_type: l1
        reg_weight: 2.32
      - id: E04
        reg_type: kl
        reg_weight: 1.43
      - id: E05
        reg_type: kl
        reg_weight: 1.48

  kl_l1_combination:
    id: G03
    description: "Combined KL+L1 regularization with varying per-component weights"
    experiments:
      # - id: E01
      #   reg_type: kl+l1
      #   reg_weight: 1.11
      #   kl_weight: 0.74
      # - id: E02
      #   reg_type: kl+l1
      #   reg_weight: 2.22
      #   kl_weight: 1.48
      # - id: E01
      #   reg_type: kl+l1
      #   reg_weight: 2.20
      #   kl_weight: 1.50
      # - id: E02
      #   reg_type: kl+l1
      #   reg_weight: 2.10
      #   kl_weight: 1.60
      # - id: E03
      #   reg_type: kl+l1
      #   reg_weight: 2.00
      #   kl_weight: 1.70
      # - id: E04
      #   reg_type: kl+l1
      #   reg_weight: 1.66
      #   kl_weight: 1.0
      - id: E05
        reg_type: kl+l1
        reg_weight: 1.70
        kl_weight: 2.00
      # - id: E06
      #   reg_type: kl+l1
      #   reg_weight: 1.20
      #   kl_weight: 2.00
      # - id: E07
      #   reg_type: kl+l1
      #   reg_weight: 1.70
      #   kl_weight: 1.50

  num_epochs:
    id: G02
    description: "Impact of number of training epochs"
    experiments:
      - id: E01
        model_type: IntentionRNN
        num_epochs: 1
      - id: E02
        model_type: IntentionLSTM
        num_epochs: 1
      - id: E03
        model_type: IntentionRNN
        num_epochs: 5
      - id: E04
        model_type: IntentionLSTM
        num_epochs: 5
      - id: E05
        model_type: IntentionTransformer
        num_epochs: 5
      - id: E06
        model_type: IntentionTransformer
        num_epochs: 8
      - id: E07
        model_type: IntentionTransformer
        num_epochs: 10
      - id: E08
        model_type: IntentionTransformer
        num_epochs: 12
