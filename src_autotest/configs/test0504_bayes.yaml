# ──────────────────────────────────────────────────────────────
# Usage (from DHIRL root):
#   python -m src_autotest.run src_autotest/configs/test0504_bayes.yaml
# ──────────────────────────────────────────────────────────────

# We locate the final step of regularization weight, then test num_epoch effects to locate RNN, LSTM, and Transformer models.
defaults:
  ll_filename: ll.csv
  output_dir: src_autotest/outputs
  num_repeats: 1
  num_latents: 3
  rand_seed: 42

  model_type: IntentionRNN
  hidden_dim: 128
  rnn_hidden_dim: 128
  num_layers: 1
  dropout: 0.3
  nhead: 4
  lr: 0.001

  reg_type: kl+l1
  reg_weight: 0.
  kl_weight: 0.

  num_epochs: 1
  loss_threshold: 0.005
  max_iterations: 180


# Each experiment only needs an id and the params that differ from defaults.
groups:
  epoch_ablation:
    id: G01
    description: "num_epochs effects for RNN, LSTM, and Transformer"
    experiments:
      - id: E01
        num_epochs: 3
      - id: E02
        num_epochs: 5
  reg_ablation:
    id: G01
    description: "Regularizer type: none / KL / L1 / KL+L1"
    experiments:
      - id: E01
        reg_type: kl+l1
        reg_weight: 0.0
        kl_weight: 0.0
      - id: E02
        reg_type: kl
        reg_weight: 1.
      - id: E03
        reg_type: l1
        reg_weight: 1.

  num_layers:
    id: G02
    description: "RNN depth (hidden_dim fixed at 128)"
    experiments:
      - id: E01
        num_layers: 2

  hidden_dim:
    id: G03
    description: "Model width: hidden_dim == rnn_hidden_dim"
    experiments:
      - id: E01
        hidden_dim: 64
        rnn_hidden_dim: 64
      - id: E02
        hidden_dim: 256
        rnn_hidden_dim: 256

  model_type:
    id: G04
    description: "Architecture comparison; Transformer uses more epochs"
    experiments:
      - id: E01
        model_type: IntentionLSTM
      - id: E02
        model_type: IntentionTransformer
        num_epochs: 6

  extra:
    id: G05
    description: "Extra experiments to fill out the plot"
    experiments:
      - id: E01
        model_type: IntentionRNN
        max_iterations: 300
      - id: E02
        model_type: IntentionTransformer
        num_epochs: 8
      - id: E03
        model_type: IntentionRNN
        num_layers: 2
        hidden_dim: 256
        rnn_hidden_dim: 256