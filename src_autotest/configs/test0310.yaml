# ──────────────────────────────────────────────────────────────
# Autotest config for src_autotest/train_labyrinth_b.py
#
# Usage (from DHIRL root):
#   python -m src_autotest.run src_autotest/configs/test0310.yaml
#   python -m src_autotest.run src_autotest/configs/test0310.yaml --groups model_comparison
# ──────────────────────────────────────────────────────────────

defaults:
  ll_filename: ll.csv
  output_dir: src_autotest/outputs
  num_repeats: 1
  num_latents: 3
  rand_seed: 42

  model_type: IntentionRNN
  hidden_dim: 128
  rnn_hidden_dim: 128
  num_layers: 1
  dropout: 0.3
  nhead: 4
  lr: 0.001

  reg_type: l1
  reg_weight: 0.45

  num_epochs: 3
  loss_threshold: 0.05
  max_iterations: 160


# Each experiment only needs an id and the params that differ from defaults.
groups:

  model_comparison:
    id: G01
    description: "RNN vs LSTM vs Transformer backbone"
    experiments:
      - id: E01
        model_type: IntentionRNN
      - id: E02
        model_type: IntentionLSTM
      - id: E03
        model_type: IntentionTransformer
        nhead: 4

  num_latents:
    id: G02
    description: "Impact of number of latent intentions"
    experiments:
      - id: E01
        num_latents: 1
      - id: E02
        num_latents: 2
      - id: E03
        num_latents: 3
      - id: E04
        num_latents: 4
      - id: E05
        num_latents: 5

  regularization:
    id: G03
    description: "L1 vs KL and different weights"
    experiments:
      - id: E01
        reg_type: l1
        reg_weight: 0.35
      - id: E02
        reg_type: l1
        reg_weight: 0.45
      - id: E03
        reg_type: l1
        reg_weight: 0.55
      - id: E04
        reg_type: kl
        reg_weight: 0.20
      - id: E05
        reg_type: kl
        reg_weight: 0.25
      - id: E06
        reg_type: kl
        reg_weight: 0.30

  learning_rate:
    id: G04
    description: "Impact of learning rate"
    experiments:
      - id: E01
        lr: 3e-3
      - id: E02
        lr: 2e-3
      - id: E03
        lr: 1e-3
