# ──────────────────────────────────────────────────────────────
# Usage (from DHIRL root):
#   python -m src_autotest.run src_autotest/configs/test0318.yaml
# ──────────────────────────────────────────────────────────────

# 
defaults:
  ll_filename: ll.csv
  output_dir: src_autotest/outputs
  num_repeats: 1
  num_latents: 3
  rand_seed: 42

  model_type: IntentionRNN
  hidden_dim: 128
  rnn_hidden_dim: 128
  num_layers: 1
  dropout: 0.3
  nhead: 4
  lr: 0.001

  reg_type: kl+l1
  reg_weight: 2.22
  kl_weight: 1.48

  num_epochs: 3
  loss_threshold: 0.05
  max_iterations: 300


# Each experiment only needs an id and the params that differ from defaults.
