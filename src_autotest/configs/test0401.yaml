# ──────────────────────────────────────────────────────────────
# Usage (from DHIRL root):
#   python -m src_autotest.run src_autotest/configs/test0401.yaml
# ──────────────────────────────────────────────────────────────

# We have got the regularization weight, time to draw the big table containing RNN, LSTM, and Transformer models.
defaults:
  ll_filename: ll.csv
  output_dir: src_autotest/outputs
  num_repeats: 2
  num_latents: 3
  rand_seed: 42

  model_type: IntentionRNN
  hidden_dim: 128
  rnn_hidden_dim: 128
  num_layers: 1
  dropout: 0.3
  nhead: 4
  lr: 0.001

  reg_type: kl+l1
  reg_weight: 2.22
  kl_weight: 1.48

  num_epochs: 3
  loss_threshold: 0.1
  max_iterations: 150


# Each experiment only needs an id and the params that differ from defaults.
groups:
  tmp:
    description: "Impact of number of training epochs"
    experiments:
      - id: E12
        model_type: IntentionLSTM
        num_latents: 6
        num_epochs: 3

      - id: E13
        model_type: IntentionTransformer
        num_latents: 1
        num_epochs: 8
