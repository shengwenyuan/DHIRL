      - id: E01
        reg_type: l1
        reg_weight: 0.70
      - id: E02
        reg_type: l1
        reg_weight: 0.80
      - id: E03
        reg_type: l1
        reg_weight: 0.90
      - id: E04
        reg_type: kl
        reg_weight: 0.30
      - id: E05
        reg_type: kl
        reg_weight: 0.35
      - id: E06
        reg_type: kl
        reg_weight: 0.40
      - id: E07
