# ──────────────────────────────────────────────────────────────
# Autotest config for src_autotest/train_labyrinth_b.py
#
# Usage (from DHIRL root):
#   python -m src_autotest.run src_autotest/configs/test0310.yaml
#   python -m src_autotest.run src_autotest/configs/test0310.yaml --groups model_comparison
# ──────────────────────────────────────────────────────────────

defaults:
  ll_filename: ll.csv
  output_dir: src_autotest/outputs
  num_repeats: 1
  num_latents: 3
  rand_seed: 42

  model_type: IntentionRNN
  hidden_dim: 128
  rnn_hidden_dim: 128
  num_layers: 1
  dropout: 0.3
  nhead: 4
  lr: 0.001

  reg_type: l1
  reg_weight: 0.45

  num_epochs: 3
  loss_threshold: 0.05
  max_iterations: 200


# Each experiment only needs an id and the params that differ from defaults.
groups:

  model_comparison:
    id: G01
    description: "RNN vs LSTM vs Transformer backbone"
    experiments:
      - id: E01
        model_type: IntentionRNN
        rand_seed: 0
      - id: E02
        model_type: IntentionRNN
        rand_seed: 7
      - id: E03
        model_type: IntentionRNN
        rand_seed: 42
      - id: E04
        model_type: IntentionRNN
        rand_seed: 99
      - id: E05
        model_type: IntentionRNN
        rand_seed: 2026
      - id: E06
        model_type: IntentionLSTM
        rand_seed: 0
      - id: E07
        model_type: IntentionLSTM
        rand_seed: 7
      - id: E08
        model_type: IntentionLSTM
        rand_seed: 42
      - id: E09
        model_type: IntentionLSTM
        rand_seed: 99
      - id: E10
        model_type: IntentionLSTM
        rand_seed: 2026
      - id: E11
        model_type: IntentionTransformer
        nhead: 4
        rand_seed: 0
      - id: E12
        model_type: IntentionTransformer
        nhead: 4
        rand_seed: 7
      - id: E13
        model_type: IntentionTransformer
        nhead: 4
        rand_seed: 42
      - id: E14
        model_type: IntentionTransformer
        nhead: 4
        rand_seed: 99
      - id: E15
        model_type: IntentionTransformer
        nhead: 4
        rand_seed: 2026

  num_latents:
